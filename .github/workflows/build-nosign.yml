name: Build Release APK (No Signing)

# Builds a release APK (R8 + resource shrinking, small size) without requiring any keystore or
# third-party secrets. When ANDROID_KEYSTORE_* environment variables are absent, the build logic
# falls back to the debug signing config, so the APK installs on a device as-is.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android build toolchain
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: "false"

      - name: Build release APK
        id: build
        shell: bash
        run: |
          set -euo pipefail

          build_time_utc=$(date -u +%Y%m%d%H%M%S)
          ./gradlew \
            --stacktrace \
            -Pduckdetector.buildTimeUtc="${build_time_utc}" \
            :app:assembleRelease

          echo "build outputs:"
          find app/build/outputs/apk/release -type f -name '*.apk' 2>/dev/null || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DuckDetector-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
